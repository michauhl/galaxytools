name: rbpbench
owner: rnateam
description: Evaluate CLIP-seq and other genomic region data using a comprehensive collection of RBP binding motifs
homepage_url: https://github.com/michauhl/RBPBench
long_description: |
  RBPBench is multi-function tool to evaluate CLIP-seq and other genomic region 
  data using a comprehensive collection of known RNA-binding protein (RBP) binding 
  motifs. RBPBench can be used for a variety of purposes, from RBP motif search 
  (database or user-supplied RBP motifs) in genomic regions, over motif enrichment 
  and co-occurrence analysis, in-depth comparisons over multiple datasets via 
  sequence and genomic annotation statistics, to benchmarking CLIP-seq peak caller 
  methods as well as comparisons across cell types and CLIP-seq protocols. RBPBench 
  supports both sequence and structure motifs, as well as regular expressions 
  (sequence and structure patterns). Moreover, users can easily provide 
  their own motif collections.
remote_repository_url: https://github.com/bgruening/galaxytools/tree/master/tools/rna_tools/rbpbench
type: unrestricted
categories:
- Sequence Analysis
- RNA
- CLIP-seq
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}."
suite:
  name: "suite_rbpbench"
  description: "A suite of Galaxy wrappers designed to work with the RBPBench tool collection."
  type: repository_suite_definition
